<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Merge PDFs in any order, or select pages to rotate and delete, and drag pages to reorder them. Everything stays on your device."
    />
    <title>PDF Processor</title>
  </head>
  <body>
    <main>
      <h1>PDF Processor</h1>
      <p>
        Merge PDFs in any order, or select pages to rotate and delete, and drag
        pages to reorder them. Everything stays on your device.
      </p>

      <div id="drop-area">
        <label for="file-input">Choose PDFs</label>
        <input id="file-input" type="file" accept="application/pdf" multiple />
      </div>

      <div class="sample-row">
        <span>Or try a sample:</span>
        <span id="sample-buttons"></span>
      </div>

      <p id="reorder-hint" hidden>Drag ⠿ to change the merge order.</p>
      <ul id="file-list"></ul>

      <button id="merge-button" type="button" disabled>Merge</button>
      <p id="message" role="alert"></p>

      <div id="page-tools">
        <button id="select-all-button" type="button" disabled>
          Select all
        </button>
        <button id="rotate-button" type="button" disabled>
          Rotate selected
        </button>
        <button id="delete-button" type="button" disabled>
          Delete selected
        </button>
        <button id="download-button" type="button" disabled>
          Download this file
        </button>
      </div>
      <p id="preview-error" role="alert"></p>
      <p id="preview-status" aria-live="polite" hidden>Rendering pages…</p>
      <section id="page-grid" aria-label="Page previews"></section>
    </main>

    <footer>
      <p>
        Only open PDFs you trust: this tool can't make a malicious file safe.
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
