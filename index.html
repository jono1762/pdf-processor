<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Processor</title>
  </head>
  <body>
    <main>
      <h1>PDF Processor</h1>

      <label for="file-input">Choose PDFs to merge</label>
      <input id="file-input" type="file" accept="application/pdf" multiple />

      <ul id="file-list"></ul>

      <button id="merge-button" type="button" disabled>Merge</button>
      <p id="message" role="alert"></p>

      <p id="preview-error" role="alert"></p>
      <p id="preview-status" aria-live="polite" hidden>Rendering pages…</p>
      <section id="page-grid" aria-label="Page previews"></section>
    </main>

    <footer>
      <p>
        Only open PDFs you trust. Files are processed on your device and never
        uploaded.
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
